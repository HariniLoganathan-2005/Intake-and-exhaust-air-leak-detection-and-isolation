<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
  body {
    margin: 0;
    padding: 0;
    background-color: transparent;
    font-family: 'Inter', sans-serif;
    color: #e2e8f0;
    overflow: hidden;
  }
  .container {
    width: 100%;
    height: 55vh;
    min-height: 500px;
    max-height: 800px;
    position: relative;
    box-sizing: border-box;
  }
  svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  
  /* Boxes and text */
  .box {
    fill: rgba(15, 23, 42, 0.8);
    stroke: rgba(148, 163, 184, 0.6);
    stroke-width: 3;
    rx: 8;
  }
  .box-label {
    font-size: 20px;
    font-weight: bold;
    fill: #f8fafc;
    text-anchor: middle;
    dominant-baseline: central;
    letter-spacing: 0.5px;
  }
  .box-label-small {
    font-size: 16px;
    fill: #94a3b8;
    text-anchor: middle;
  }
  .data-label {
    font-size: 18px;
    font-family: monospace;
    font-weight: bold;
    fill: #facc15;
  }

  /* Pipes */
  .track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .flow-dots {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    stroke-linejoin: round;
    /* dasharray handled by JS for density */
  }
  
  /* Colors */
  .color-fresh { stroke: #3b82f6; }
  .color-hot   { stroke: #f87171; }
  .color-cool  { stroke: #4ade80; }
  .color-exh   { stroke: #c084fc; }

  /* Engine Animations */
  #piston {
    /* Driven by JS to match RPM */
  }
  #combustion {
    opacity: 0;
  }

  /* Leak SVG indicator styles */
  .leak-indicator {
    pointer-events: none;
  }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 10px;
    left: 20px;
    display: flex;
    gap: 20px;
    font-size: 14px;
    background: rgba(15, 25, 41, 0.9);
    padding: 12px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-weight: bold; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
</style>
</head>
<body>

<div class="container" id="main-container">
  <svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
    <!-- DEFINITIONS -->
    <defs>
      <radialGradient id="fire">
        <stop offset="0%" stop-color="#fb923c" stop-opacity="1"/>
        <stop offset="30%" stop-color="#ef4444" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
      </radialGradient>
      
      <filter id="motion-blur" x="-50%" y="-50%" width="200%" height="200%">
        <!-- Dynamic blur applied via JS when speed is high -->
        <feGaussianBlur id="blur-filter" stdDeviation="0" />
      </filter>

      <g id="rotor">
        <circle cx="0" cy="0" r="35" fill="rgba(30,41,59,0.9)" stroke="rgba(148,163,184,0.8)" stroke-width="3"/>
        <path d="M-28,-28 L28,28 M-28,28 L28,-28 M-38,0 L38,0 M0,-38 L0,38" stroke="rgba(255,255,255,0.7)" stroke-width="6"/>
        <circle cx="0" cy="0" r="8" fill="white"/>
      </g>

      <!-- Leak indicator: small pulsing ring + dot — reusable via <use> -->
      <g id="leak-marker">
        <circle cx="0" cy="0" r="5" fill="currentColor" opacity="0.95"/>
        <circle cx="0" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity="0.7">
          <animate attributeName="r" values="9;17;9" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="15" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35">
          <animate attributeName="r" values="15;24;15" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </defs>

    <!-- BACKGROUND TRACKS -->
    <path class="track" d="M 60 180 L 680 180" />
    <path class="track" d="M 680 180 L 1150 180" />
    <path class="track" d="M 1350 180 L 1420 180 L 1280 400" />
    <path class="track" d="M 1080 400 L 920 400" />
    <path class="track" d="M 720 400 L 520 400" />
    <path class="track" d="M 400 360 L 630 280" />
    <path class="track" d="M 630 300 L 290 560" />
    <path class="track" d="M 370 560 L 1450 560" />

    <!-- FLOW DOTS -->
    <!-- Fresh Air -->
    <path class="flow-dots forward color-fresh" d="M 60 180 L 680 180" />
    
    <!-- Hot/Compressed Air -->
    <path class="flow-dots forward color-hot" d="M 680 180 L 1150 180" />
    
    <!-- Cooled Dense Air -->
    <path class="flow-dots forward color-cool" d="M 1350 180 L 1420 180 L 1280 400" />
    <path class="flow-dots reverse color-cool" d="M 920 400 L 1080 400" /> <!-- Reversed -->

    <!-- Exhaust -->
    <path class="flow-dots reverse color-exh" d="M 520 400 L 720 400" /> <!-- Reversed -->
    <path class="flow-dots forward color-exh" d="M 400 360 L 630 280" />
    <path class="flow-dots forward color-exh" d="M 630 300 L 290 560" />
    <path class="flow-dots forward color-exh" d="M 370 560 L 1450 560" />

    <!-- COMPONENTS -->
    <!-- Air Filter -->
    <rect class="box" x="120" y="140" width="160" height="80" />
    <text class="box-label" x="200" y="180">Air Filter</text>
    
    <!-- MAF Sensor -->
    <rect class="box" x="380" y="140" width="120" height="80" />
    <text class="box-label" x="440" y="180">MAF</text>

    <!-- Intercooler -->
    <rect class="box" x="1150" y="140" width="200" height="80" />
    <text class="box-label" x="1250" y="180">Intercooler</text>

    <!-- Intake Manifold -->
    <rect class="box" x="1080" y="360" width="200" height="80" />
    <text class="box-label" x="1180" y="400">Intake Manifold</text>

    <!-- Exh Manifold -->
    <rect class="box" x="320" y="360" width="200" height="80" />
    <text class="box-label" x="420" y="400">Exh. Manifold</text>

    <!-- DOC, DPF, SCR, Tailpipe -->
    <rect class="box" x="250" y="520" width="120" height="80" />
    <text class="box-label" x="310" y="560">DOC</text>
    
    <rect class="box" x="470" y="520" width="120" height="80" />
    <text class="box-label" x="530" y="560">DPF</text>
    
    <rect class="box" x="740" y="520" width="120" height="80" />
    <text class="box-label" x="800" y="560">SCR</text>
    
    <rect class="box" x="1010" y="520" width="140" height="80" />
    <text class="box-label" x="1080" y="560">Tailpipe</text>

    <!-- ENGINE CYLINDER -->
    <g id="engine-block">
      <!-- Outer block -->
      <rect class="box" x="720" y="240" width="200" height="220" />
      <text class="box-label" x="820" y="320">Engine</text>
      
      <!-- Injector tip -->
      <line x1="820" y1="200" x2="820" y2="240" stroke="#cbd5e1" stroke-width="8" />
      <rect x="805" y="170" width="30" height="30" fill="#64748b" rx="4" />
      <text class="box-label-small" x="820" y="150">Injector</text>
      
      <!-- Combustion Flash -->
      <circle id="combustion" cx="820" cy="270" r="50" fill="url(#fire)" />
      
      <!-- Piston -->
      <rect id="piston" x="740" y="400" width="160" height="50" fill="#e2e8f0" rx="4" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- TURBOS -->
    <!-- Shaft -->
    <line x1="630" y1="220" x2="630" y2="260" stroke="#cbd5e1" stroke-width="8" stroke-dasharray="8 8"/>
    <polygon points="615,205 645,205 630,185" fill="#94a3b8"/>
    <polygon points="615,275 645,275 630,295" fill="#94a3b8"/>
    
    <!-- Rotors -->
    <g transform="translate(630,180)">
      <use href="#rotor" id="compressor-wheel" filter="url(#motion-blur)"/>
    </g>
    <text class="box-label-small" x="630" y="120">Compressor</text>
    
    <g transform="translate(630,300)">
      <use href="#rotor" id="turbine-wheel" filter="url(#motion-blur)"/>
    </g>
    <text class="box-label-small" x="630" y="360">Turbine</text>
    
    <!-- Live Turbo RPM Readout -->
    <text class="data-label" id="turbo-rpm-text" x="630" y="90">0 RPM</text>

    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!-- LEAK INDICATORS — each placed at the exact midpoint of its pipe   -->
    <!-- Hidden by default; JS shows only the active one                   -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->

    <!-- Zone A: pre-turbo — midpoint of Air Filter→MAF fresh-air pipe (x=270, y=180) -->
    <g id="leak-zone-A" display="none" color="#60a5fa">
      <use href="#leak-marker" x="270" y="180"/>
      <text x="270" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#60a5fa" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone B: before intercooler — hot compressed-air pipe midpoint (x=905, y=180) -->
    <g id="leak-zone-B-before" display="none" color="#f87171">
      <use href="#leak-marker" x="905" y="180"/>
      <text x="905" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#f87171" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone B: after intercooler — cooled air pipe going down to intake manifold (x=1390, y=290) -->
    <g id="leak-zone-B-after" display="none" color="#4ade80">
      <use href="#leak-marker" x="1390" y="290"/>
      <text x="1430" y="290" text-anchor="start" font-size="13" font-weight="bold" fill="#4ade80" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone C: exhaust_manifold — at the exhaust manifold box top edge (x=420, y=360) -->
    <g id="leak-zone-C-manifold" display="none" color="#c084fc">
      <use href="#leak-marker" x="420" y="355"/>
      <text x="420" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#c084fc" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone C: manifold_to_turbine — pipe from exh manifold to turbine, midpoint ~(515,320) -->
    <g id="leak-zone-C-mant" display="none" color="#c084fc">
      <use href="#leak-marker" x="515" y="320"/>
      <text x="555" y="315" text-anchor="start" font-size="13" font-weight="bold" fill="#c084fc" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone C: turbine_to_doc — diagonal pipe turbine→DOC, midpoint ~(460,430) -->
    <g id="leak-zone-C-tdoc" display="none" color="#c084fc">
      <use href="#leak-marker" x="460" y="430"/>
      <text x="500" y="425" text-anchor="start" font-size="13" font-weight="bold" fill="#c084fc" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone C: doc_to_dpf — bottom exhaust pipe between DOC and DPF, midpoint ~(395,560) -->
    <g id="leak-zone-C-ddpf" display="none" color="#c084fc">
      <use href="#leak-marker" x="395" y="560"/>
      <text x="395" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#c084fc" opacity="0.9">LEAK</text>
    </g>

    <!-- Zone C: dpf_to_scr — bottom exhaust pipe between DPF and SCR, midpoint ~(645,560) -->
    <g id="leak-zone-C-dscr" display="none" color="#c084fc">
      <use href="#leak-marker" x="645" y="560"/>
      <text x="645" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#c084fc" opacity="0.9">LEAK</text>
    </g>
  </svg>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#3b82f6"></div> Fresh Air</div>
    <div class="legend-item"><div class="dot" style="background:#f87171"></div> Hot/Compressed</div>
    <div class="legend-item"><div class="dot" style="background:#4ade80"></div> Cooled Dense</div>
    <div class="legend-item"><div class="dot" style="background:#c084fc"></div> Treated Exhaust</div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const port = urlParams.get('port') || window.parent.stPort || 8502;
  
  const forwardPaths = Array.from(document.querySelectorAll('.forward'));
  const reversePaths = Array.from(document.querySelectorAll('.reverse'));
  const piston = document.getElementById('piston');
  const combustion = document.getElementById('combustion');
  const compWheel = document.getElementById('compressor-wheel');
  const turbWheel = document.getElementById('turbine-wheel');
  const blurFilter = document.getElementById('blur-filter');
  const turboText = document.getElementById('turbo-rpm-text');

  // All leak indicator SVG groups
  const leakGroups = {
    'leak-zone-A':          document.getElementById('leak-zone-A'),
    'leak-zone-B-before':   document.getElementById('leak-zone-B-before'),
    'leak-zone-B-after':    document.getElementById('leak-zone-B-after'),
    'leak-zone-C-manifold': document.getElementById('leak-zone-C-manifold'),
    'leak-zone-C-mant':     document.getElementById('leak-zone-C-mant'),
    'leak-zone-C-tdoc':     document.getElementById('leak-zone-C-tdoc'),
    'leak-zone-C-ddpf':     document.getElementById('leak-zone-C-ddpf'),
    'leak-zone-C-dscr':     document.getElementById('leak-zone-C-dscr'),
  };
  
  // Interpolation targets
  let state = {
    rpm: 800,
    maf: 50,
    n_turbo: 20000,
    leak_zone: null,
    leak_sub: null,
    status: "WARMING_UP"
  };
  
  let current = {
    rpm: 800,
    maf: 50,
    n_turbo: 20000
  };

  // Animation variables
  let particleOffset = 0;
  let turboAngle = 0;
  let enginePhase = 0;

  // ── SVG Leak Indicator helpers ───────────────────────────────────────────────
  function showLeak(zone, sub) {
    Object.values(leakGroups).forEach(g => g && g.setAttribute('display', 'none'));
    let id = null;
    if (zone === 'A') {
      id = 'leak-zone-A';
    } else if (zone === 'B') {
      id = (sub && sub.includes('before')) ? 'leak-zone-B-before' : 'leak-zone-B-after';
    } else if (zone === 'C') {
      if      (sub && sub.includes('manifold_to_turbine')) id = 'leak-zone-C-mant';
      else if (sub && sub.includes('turbine_to_doc'))      id = 'leak-zone-C-tdoc';
      else if (sub && sub.includes('doc_to_dpf'))          id = 'leak-zone-C-ddpf';
      else if (sub && sub.includes('dpf_to_scr'))          id = 'leak-zone-C-dscr';
      else                                                 id = 'leak-zone-C-manifold';
    }
    if (id && leakGroups[id]) leakGroups[id].setAttribute('display', 'inline');
  }

  function hideLeak() {
    Object.values(leakGroups).forEach(g => g && g.setAttribute('display', 'none'));
  }

  async function pollState() {
    try {
      const res = await fetch(`http://localhost:${port}/state.json`);
      if (res.ok) {
        const data = await res.json();
        state.rpm       = data.rpm       || 800;
        state.maf       = data.maf       || 50;
        state.n_turbo   = data.n_turbo   || 20000;
        state.leak_zone = data.leak_zone;
        state.leak_sub  = data.leak_sub;
        state.status    = data.status;
      }
    } catch (e) {}
  }

  setInterval(pollState, 250);

  // Main Render Loop (60 FPS)
  let lastTime = performance.now();
  
  function renderFrame(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;

    // Smooth interpolation
    const lerp = 4.0 * dt;
    current.rpm     += (state.rpm     - current.rpm)     * lerp;
    current.maf     += (state.maf     - current.maf)     * lerp;
    current.n_turbo += (state.n_turbo - current.n_turbo) * lerp;

    // --- Particle Animation ---
    const particleSpeed = (current.rpm / 2000) * 150;
    particleOffset -= particleSpeed * dt;
    if (particleOffset < -1000) particleOffset += 1000;
    const gap  = Math.max(16, 80 - (current.maf * 0.25));
    const dash = `12 ${gap}`;
    forwardPaths.forEach(p => { p.style.strokeDashoffset = particleOffset; p.style.strokeDasharray = dash; });
    reversePaths.forEach(p => { p.style.strokeDashoffset = -particleOffset; p.style.strokeDasharray = dash; });

    // --- Turbo Animation ---
    const visualTurboRps = (current.n_turbo / 60) * 0.1;
    turboAngle += visualTurboRps * 360 * dt;
    const rotStr = `rotate(${turboAngle})`;
    compWheel.setAttribute('transform', rotStr);
    turbWheel.setAttribute('transform', rotStr);
    blurFilter.setAttribute('stdDeviation', current.n_turbo > 70000 ? `0 ${(current.n_turbo - 70000) / 10000}` : `0 0`);
    turboText.textContent = `${Math.round(current.n_turbo).toLocaleString()} RPM`;

    // --- Engine Cylinder Animation ---
    const visualEngineRps = (current.rpm / 3000) * 3;
    enginePhase += visualEngineRps * dt;
    if (enginePhase >= 1) enginePhase -= 1;
    const strokeAmt = Math.cos(enginePhase * Math.PI * 2);
    piston.setAttribute('transform', `translate(0, ${-90 * ((strokeAmt + 1) / 2)})`);
    combustion.style.opacity = enginePhase < 0.15 ? (1.0 - enginePhase / 0.15)
                             : enginePhase > 0.85 ? (enginePhase - 0.85) / 0.15 : 0;

    // --- Leak SVG Indicator ---
    const isLeak = state.status === "ALERT" || state.status === "MONITOR";
    isLeak && state.leak_zone ? showLeak(state.leak_zone, state.leak_sub) : hideLeak();

    requestAnimationFrame(renderFrame);
  }

  requestAnimationFrame(renderFrame);

</script>
</body>
</html>
